name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: 静态检查
        run: uv run ruff check .

      - name: 单元测试
        run: uv run pytest -q

      - name: 仓库级自检
        run: uv run talentpro repo-check . --strict

      - name: 示例题目校验
        run: uv run talentpro check examples/exam_001 --strict
